name: release

on:
  push:
    branches: [master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

env:
  REGION: southamerica-east1
  REPOSITORY: stampyx
  IMAGE: api

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Before setup-node, not after: the `yarn` cache mode asks the yarn on PATH where its
      # cache lives, and the runner's preinstalled yarn is 1.x, which answers for a different
      # directory than the Yarn 4 pinned in package.json.
      - run: corepack enable

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: yarn

      - run: yarn install --immutable
      - run: yarn lint
      - run: yarn format:check
      - run: yarn typecheck
      - run: yarn test

  build-push:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      - uses: google-github-actions/setup-gcloud@v2
      - run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: prod
          push: true
          tags: |
            ${{ env.REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - run: echo "Deploy with API_TAG=${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
